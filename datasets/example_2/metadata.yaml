# --- FRDR required fields ---
description: >
  These data files include airborne blowing snow density measurements using a portable highspeed
  camera and 432 nm wavelength laser light plane apparatus. Blowing snow measurements were taken
  in the first 30 mm above the snow surface. Approx 30 cm away in the spanwise direction across
  the mean wind direction were two Campbell Scientific CSAT3 sonic anemometers situated on a
  single mast. The anemometers sampled raw measurements at 50 Hz. The height about snow for
  the two anemometers (Upper=U, Lower=L) varied throughout the season:
  20 Nov 2015: U=150 cm L=20 cm; 4 Dec 2015: U=170 cm L=40 cm; Dec 7 2015: U=170 cm L=40 cm;
  Feb 3 2016: U=155 cm L=25 cm; Mar 3 2016: U=140 cm L=10 cm.
  The basin is located in the headwater of Saskatchewan River Basin that provides vital water
  supplies to the Canadian Prairie Provinces.
