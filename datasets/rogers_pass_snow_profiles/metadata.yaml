description: Multi-instrument snow profile observations from a six-day field campaign
  (March 1-6, 2025) at Rogers Pass, Glacier National Park, British Columbia, Canada.
  Includes manual snow stratigraphy profiles (StratiTemplate Excel), InfraRed Integrating
  Sphere (IRIS) specific surface area measurements, SnowMicroPenetrometer (SMP) high-resolution
  hardness profiles, and compact K-band (24 GHz) FMCW radar transects for snow depth
  and snow water equivalent retrieval. Observations were collected at five study sites
  (Fidelity, Jim Bay Corner, Hermit, Round Hill, Christiana Ridge) in collaboration
  with Parks Canada's Avalanche Control Program. Data are raw as collected.
