id: rogers_pass_snow_profiles
title: Snow profile observation datasets, Rogers Pass, Glacier National Park, British Columbia, Canada
doi: ''
doi_url: ''
frdr_url: ''
description: >-
  Multi-instrument snow profile observations from a six-day field campaign
  (2025-03-01 to 2025-03-06) at Rogers Pass, Glacier National Park, British
  Columbia, Canada. The dataset includes StratiTemplate snow stratigraphy
  workbooks, IRIS TXT observations, SnowMicroPenetrometer (.pnt) profiles,
  SnowScope CSV profiles, 24 GHz FMCW radar transects, and supporting spatial
  linkage tables and RTK GPS/shapefile exports collected across Fidelity, Jim
  Bay Corner, Hermit, Round Hill, and Christiana Ridge in collaboration with
  Parks Canada's Avalanche Control Program. Files are primarily raw or direct
  instrument-export field data.
