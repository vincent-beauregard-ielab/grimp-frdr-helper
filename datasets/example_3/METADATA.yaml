# --- FRDR required fields ---
description: >
  This dataset provides high-resolution vegetation maps, labeled training data, and supporting
  photogrammetric products derived from drone-based surveys conducted in Arctic upland tundra
  at the Trail Valley Creek research station (Northwest Territories, Canada) between July 24
  and July 29, 2023. Using a DJI Mavic 3 Multispectral drone equipped with RTK, multiple
  missions were flown at different altitudes to acquire RGB imagery at ground sampling distances
  (GSD) of 2.5 mm, 8 mm, and 1.6 cm, supporting detailed vegetation classification across
  various spatial scales. The dataset includes orthomosaics, digital surface and terrain models
  (DSM, DTM), canopy height models (CHM), and dense point clouds for 38 missions.
  Field-verified species identifications were used to create labeled geopackages with
  species-level annotations over 25x25 cm grids. These annotations were used to train
  convolutional neural network models, and the resulting vegetation map predictions (at low,
  medium, and high resolution) are shared as raster and vector products. Vegetation
  classification distinguishes between functional groups such as graminoids, lichens, and dwarf
  or tall shrubs. All predictions are georeferenced and aligned with their respective
  drone-derived photogrammetric inputs.
