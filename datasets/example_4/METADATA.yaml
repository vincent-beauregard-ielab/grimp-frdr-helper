# --- FRDR required fields ---
description: >
  Snow survey data collected by Alberta Environment and Protected Areas in the oil sands region
  (boreal plains) under Oil Sands Monitoring Program. Various snow properties, including snow
  depth, density and snow water equivalent across four different watersheds and four different
  land cover types (i.e., Open, Flat Low Lying, Coniferous and Mixed Deciduous) are provided.
  This dataset also includes snow data collected under the Regional Aquatics Monitoring Program
  from 2009 to 2017.
